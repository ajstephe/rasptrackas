<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"/>
    <meta name="theme-color" content="#0f2744"/>
    <!-- Tells the browser this page genuinely supports both schemes and to
         pick per the OS preference by default — without it, some browsers
         (notably iOS Safari for an installed/home-screen PWA, which this is)
         don't reliably follow prefers-color-scheme at all. The CSS
         color-scheme property below does the same job for engines that
         read it there instead; :root[data-theme] overrides both once the
         user picks Light/Dark explicitly in More... -->
    <meta name="color-scheme" content="light dark"/>

    <!-- Standalone/installed-app behaviour: apple-mobile-web-app-capable covers
         iOS Safari's "Add to Home Screen"; mobile-web-app-capable is the modern,
         cross-browser equivalent Chrome/Android now honours. Both are needed —
         neither alone covers both platforms — plus a proper manifest.json below,
         which is what Android actually uses to decide whether "Add to Home
         Screen" installs a real chromeless app vs. just a browser bookmark. -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png"/>
    <!-- Classic favicon.ico, generated from the same 192px source. Most
         browsers resolve the PNG above fine, but pinning to the Windows
         taskbar (and some older Edge/compat contexts) still goes looking
         for /favicon.ico specifically and falls back to a blank page icon
         without one. -->
    <link rel="icon" href="/favicon.ico" sizes="any"/>

    <!-- iOS launch screens — without these, opening the installed app shows
         a plain white flash (regardless of theme) for the beat before the
         app's own first paint, which stands out badly against the navy/
         black-translucent status bar treatment above. Each is the app icon
         centred on a flat fill matching --page-bg for that theme exactly
         (see public/splash — generated from pwa-512x512.png), targeted at
         one current iPhone screen size via its exact device-width/height/
         pixel-ratio combination, the only way Safari's launch-screen
         matching works. Portrait only — orientation is locked to portrait
         in manifest.json, so there's no landscape case to cover. Devices
         older/newer than this list just fall back to the plain white
         flash, same as before. -->
    <link rel="apple-touch-startup-image" href="/splash/se-light.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/se-dark.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/mini-light.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/mini-dark.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/standard-light.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/standard-dark.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/pro-light.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/pro-dark.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/plus-light.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/plus-dark.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/promax-light.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/promax-dark.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>

    <title>Overtime &amp; Shift Tracker by Adam Stephens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <!-- DM Sans now includes 800 alongside the weights already here —
         fontWeight:800 is used on buttons/labels throughout the app, but that
         cut was never actually being requested, so browsers were silently
         substituting the nearest loaded weight (900) instead. The figures font,
         IBM Plex Sans, is loaded at 500/600/700; MONO call sites use 700 at
         most. -->
    <!-- Inter (Professional Light) and Cabin (Corporate) are
         added alongside DM Sans/IBM Plex Sans so every theme beyond the
         default can load its type without a second request each. -->
    <!-- Space Grotesk (Midnight), Ysabeau Office (Flagship), Titillium
         Web (Heritage) Barlow Semi Condensed (Energy), Zen Kaku Gothic New (Goji) and Arimo (Luftplane) added alongside the rest for the same reason Inter was —
         so all Appearance options load their type up front instead of on
         first pick. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=IBM+Plex+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Ysabeau+Office:wght@400;500;600;700;800;900&family=Titillium+Web:wght@400;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Arimo:wght@400;500;600;700&family=Cabin:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,600;0,700;1,700&family=Mountains+of+Christmas:wght@700&family=Lato:wght@400;700;900&family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800;1,900&family=Cabin:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,600;0,700;1,700&family=Mountains+of+Christmas:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet"/>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body,#root{height:100%;width:100%}

      /* ── Theme tokens ──────────────────────────────────────────────────
         The app renders almost entirely via inline style objects, so these
         custom properties are read directly as style values (e.g.
         background:'var(--surface)') rather than through CSS classes.
         Light values live on :root; dark overrides apply either when the
         OS prefers dark and the user hasn't overridden it (data-theme
         unset), or when the user has explicitly chosen dark. This mirrors
         the artifact-design light/dark pattern used for the app's own
         mockups. */
      :root{
        /* App name gradient and the purple TOIL/Mix tag text — set per
           theme so both stay readable on dark backgrounds. */
        --title-grad:linear-gradient(135deg,#1e3a5f,#2563eb);
        --tag-purple:#6d28d9;
        color-scheme: light dark;
        --page-bg:#e2e8f0;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f8fafc;
        --surface-2-rgb:248,250,252;
        --chip-bg:#f1f5f9;
        --border:#e2e8f0;
        --border-2:#f1f5f9;
        --ink:#0f172a;
        --muted:#64748b;
        /* --quiet is deliberately quieter than --muted (tertiary vs.
           secondary label, in Apple's terms) so it's never going to hit
           full 4.5:1 AA on its own — Apple's own tertiaryLabel doesn't
           either, by design. #94a3b8 measured ~2.1:1 on the page
           background though, well below even that tier's usual ~3:1;
           nudged one step darker to land there without erasing the
           distinction from --muted. */
        --quiet:#78849b;
        --navy:#0f2744;
        --navy-rgb:15,39,68;
        --sidebar-bg-rgb:15,39,68;
        --accent:#b8823f;
        --app-font:'DM Sans',system-ui,sans-serif;
        /* Money/hours figures (MONO in App.jsx): IBM Plex Sans in every
           theme except Flagship, which sets its own. Equal-width digits, so
           columns line up, without a typewriter look. */
        --num-font:'IBM Plex Sans',system-ui,sans-serif;
        /* Expected pay from planned shifts: sky blue, kept apart from real
           money (navy gross, green net) and every status colour. */
        --exp:#0284c7;
        --exp-tint:#e0f2fe;
        --exp-ink:#075985;
        --tint-blue:#eff6ff;
        --tint-red:#fef2f2;
        --tint-green:#f0fdf4;
        --tint-green-2:#dcfce7;
        --tint-purple:#f5f3ff;
        --tint-amber:#fffbeb;
        --tint-amber-2:#fef3c7;
        --tint-teal:#f0fdfa;
        --text-navy:#1e3a5f;
        --text-red-deep:#991b1b;
        --text-green-deep:#166534;
        --text-purple-deep:#4c1d95;
        --text-amber-deep:#92400e;
        --tint-blue-2:#dbeafe;
        --tint-brass:#faf3e8;
        --tint-indigo:#e0e7ff;
        --text-indigo-deep:#4338ca;
        --surface-red-mid:#fca5a5;
        --text-blue-deep:#1e40af;
      }
      @media (prefers-color-scheme: dark){
        /* Every custom theme below is a fixed look, not a dark-mode-aware
           variant of the default — excluded here the same way an explicit
           "light" choice already is, so a dark OS never quietly overrides
           any of them one token at a time. Midnight is a dark-first design
           in its own right, so this matters just as much for it as it does
           for the light ones. */
        :root:not([data-theme="light"]):not([data-theme="corporate"]):not([data-theme="professional"]):not([data-theme="midnight"]):not([data-theme="flagship"]):not([data-theme="heritage"]):not([data-theme="energy"]):not([data-theme="muji"]):not([data-theme="luftplane"]):not([data-theme="miami"]):not([data-theme="miamidays"]):not([data-theme="claret"]):not([data-theme="barista"]):not([data-theme="festive"]):not([data-theme="desktop90s"]):not([data-theme="tube"]){
          --title-grad:linear-gradient(135deg,#eef2f7,#93c5fd);
          --exp:#38bdf8;
          --exp-tint:#0c2a3d;
          --exp-ink:#7dd3fc;
          --tag-purple:#cbb8f7;
          --page-bg:#0b1220;
          --surface:#111c2e;
          --surface-rgb:17,28,46;
          --surface-2:#0e1726;
          --surface-2-rgb:14,23,38;
          --chip-bg:#182740;
          --border:#20304a;
          --border-2:#1c2c44;
          --ink:#eef2f7;
          --muted:#93a4bb;
          --quiet:#64789a;
          --navy:#16314f;
          --savebar:#1e3a5f;
          --navy-rgb:22,49,79;
          --sidebar-bg-rgb:22,49,79;
          --accent:#b8823f;
          --tint-blue:#132840;
          --tint-red:#2c1416;
          --tint-green:#0f2a1e;
          --tint-green-2:#123322;
          --tint-purple:#221a3d;
          --tint-amber:#2b2110;
          --tint-amber-2:#332714;
          --tint-teal:#0e2b2a;
          --text-navy:#9fc0e6;
          --text-red-deep:#f3a9a9;
          --text-green-deep:#86e0ae;
          --text-purple-deep:#cbb8f7;
          --text-amber-deep:#f3c58c;
          --tint-blue-2:#16314f;
          --tint-brass:#2e2415;
          --tint-indigo:#1c1f3d;
          --text-indigo-deep:#a9b3f5;
          --surface-red-mid:#5c2020;
          --text-blue-deep:#a8c5f0;
        }
      }

      /* ── Miami Nights ── 1980s Miami after dark: a dusk sky fading from
         violet to deep indigo, pastel aqua and flamingo pink neon, white
         linen text, and a sunset-gradient statement card. Exo 2, with the
         title in heavy italics like a neon sign. */
      :root[data-theme="miami"]{
        color-scheme: dark;
        --exp:#5ce1e6; --exp-tint:#123a4a; --exp-ink:#a6f3f5;
        --title-grad:linear-gradient(90deg,#ff6ec7,#ffffff 50%,#5ce1e6);
        --tag-purple:#d7a8ff;
        --save-bg:#ff6ec7; --save-ink:#ffffff; --hero-label:#ffe08a;
        --page-bg:#1a1238; --surface:rgba(30,20,66,0.92); --surface-rgb:30,20,66;
        --surface-2:#211650; --surface-2-rgb:33,22,80;
        --chip-bg:#2c1f62; --border:#3d2d7d; --border-2:#2e2163;
        --ink:#fff7fb; --muted:#cbbbe8; --quiet:#9a88c4;
        --navy:#2a1450; --savebar:#24124a; --navy-rgb:42,20,80; --sidebar-bg-rgb:22,12,50;
        --accent:#ff6ec7;
        --app-font:'Exo 2',system-ui,sans-serif; --num-font:'Exo 2',system-ui,sans-serif;
        --tint-blue:#162a55; --tint-red:#4a1438; --tint-green:#0f3a3c; --tint-green-2:#124a4c;
        --tint-purple:#33196a; --tint-amber:#4a2a2a; --tint-amber-2:#5a3030; --tint-teal:#0f3c48;
        --text-navy:#a6f3f5; --text-red-deep:#ff9ad5; --text-green-deep:#7af0d0; --text-purple-deep:#d7a8ff;
        --text-amber-deep:#ffd08a; --tint-blue-2:#1d3466; --tint-brass:#4a1a4a; --tint-indigo:#2a2168;
        --text-indigo-deep:#c3bbff; --surface-red-mid:#7a2456; --text-blue-deep:#a6f3f5;
      }
      :root[data-theme="miami"] body,:root[data-theme="miami"] [style*="background: var(--page-bg)"]{background:linear-gradient(180deg,#3a1660 0%,#1a1238 38%,#0f0b26 100%) fixed!important}
      :root[data-theme="miami"] .app-header span:first-child{font-style:italic;font-weight:900!important;letter-spacing:0!important}
      :root[data-theme="miami"] [style*="background: var(--navy)"]{background:linear-gradient(160deg,#2a1450 0%,#5a2a9a 42%,#d24fa6 78%,#ff9a6b 100%)!important}
      :root[data-theme="miami"] [style*="background: var(--navy)"] button{background:rgba(26,18,56,0.78)!important}
      :root[data-theme="miami"] [style*="background: var(--surface)"]{border:1px solid rgba(92,225,230,0.35)!important;box-shadow:0 0 18px rgba(255,110,199,0.12)}
      /* ── Mind the Gap ── a city underground railway: tiled white
         platforms, a blue station-name-board header, white cards with a
         line-colour stripe down the left like a line diagram, a dark
         night-tube sidebar, and Cabin (a humanist sans in the spirit of
         Edward Johnston's lettering) throughout. */
      :root[data-theme="tube"]{
        color-scheme: light;
        --exp:#0019A8; --exp-tint:#e3e7fb; --exp-ink:#0019A8;
        --title-grad:linear-gradient(90deg,#ffffff,#ffffff);
        --tag-purple:#9B0056;
        --save-bg:#FFD329; --save-ink:#111111; --hero-label:#FFD329;
        --page-bg:#eceef1; --surface:#ffffff; --surface-rgb:255,255,255;
        --surface-2:#f6f7f9; --surface-2-rgb:246,247,249;
        --chip-bg:#eef0f4; --border:#d4d8de; --border-2:#e3e6ea;
        --ink:#111111; --muted:#4a4f57; --quiet:#6b7079;
        --navy:#0019A8; --savebar:#0b1033; --navy-rgb:0,25,168; --sidebar-bg-rgb:11,16,51;
        --accent:#DC241F;
        --app-font:'Cabin',system-ui,sans-serif; --num-font:'Cabin',system-ui,sans-serif;
        --tint-blue:#e3e7fb; --tint-red:#fde4e3; --tint-green:#ddf1e3; --tint-green-2:#c4e6cf;
        --tint-purple:#f5e1ec; --tint-amber:#fff6d6; --tint-amber-2:#ffeba3; --tint-teal:#dcf0f8;
        --text-navy:#0b1033; --text-red-deep:#b01c18; --text-green-deep:#006127; --text-purple-deep:#7a0045;
        --text-amber-deep:#7a4300; --tint-blue-2:#cdd5f7; --tint-brass:#fde4e3; --tint-indigo:#e3e7fb;
        --text-indigo-deep:#0019A8; --surface-red-mid:#f2a19e; --text-blue-deep:#0019A8;
      }
      :root[data-theme="tube"] .app-header{background:#0019A8!important;border-bottom:4px solid #DC241F!important}
      :root[data-theme="tube"] .app-header > div:first-child span:first-child{font-family:'Cabin',sans-serif!important;font-weight:700!important;-webkit-text-fill-color:#ffffff!important;letter-spacing:0.2px!important}
      :root[data-theme="tube"] .app-header > div:first-child span:last-child{color:#c9d1ff!important}
      :root[data-theme="tube"] [style*="--num-font"]:is([style*="font-size: 2"],[style*="font-size: 3"]){font-weight:700!important;letter-spacing:-0.5px}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header){border-left:7px solid #DC241F!important;border-radius:0 4px 4px 0!important;box-shadow:0 1px 2px rgba(11,16,51,0.08)!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+1){border-left-color:#DC241F!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+2){border-left-color:#0019A8!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+3){border-left-color:#007D32!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+4){border-left-color:#FFD329!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+5){border-left-color:#9B0056!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+6){border-left-color:#0098D4!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+7){border-left-color:#B36305!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+8){border-left-color:#A0A5A9!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+9){border-left-color:#F3A9BB!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:not(.app-header):nth-child(10n+10){border-left-color:#000000!important}
      :root[data-theme="tube"] [style*="background: var(--navy)"]{border-radius:0!important;border-bottom:6px solid #DC241F!important}
      /* the hero's top-right corner follows the card's, so the red side stripe and the hero's red base meet in one clean right angle */
      :root[data-theme="tube"] [style*="background: var(--surface)"] > [style*="background: var(--navy)"]{border-top-right-radius:3px!important}
      :root[data-theme="tube"] [style*="background: var(--surface)"]:has(> [style*="background: var(--navy)"]){overflow:visible!important}
      /* an interchange station where the two red lines cross: white disc, dark ring, centred on the junction */
      :root[data-theme="tube"] [style*="background: var(--surface)"] > [style*="background: var(--navy)"] + *{position:relative}
      :root[data-theme="tube"] [style*="background: var(--surface)"] > [style*="background: var(--navy)"] + *::before{content:'';position:absolute;left:-14.5px;top:-14px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;background:#ffffff;border:5px solid #0b1033;z-index:3;pointer-events:none}
      /* the lead card on every other tab: a Northern-black line along its top meets its side stripe, with the same interchange on the corner */
      :root[data-theme="tube"] [data-station="hero"]{position:relative;overflow:visible!important;border-left:7px solid #DC241F!important}
      :root[data-theme="tube"] [data-station="hero"]::before{content:'';position:absolute;left:-14.5px;bottom:-14px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;background:#ffffff;border:5px solid #0b1033;z-index:3;pointer-events:none}
      :root[data-theme="tube"] [data-station="card"]{position:relative;overflow:visible!important;border-top:5px solid #000000!important}
      :root[data-theme="tube"] [data-station="card"]::before{content:'';position:absolute;left:-14.5px;top:-13.5px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;background:#ffffff;border:5px solid #0b1033;z-index:3;pointer-events:none}
      :root[data-theme="tube"] [style*="background: var(--navy)"] [style*="color: rgb(124, 147, 179)"]{color:#c9d1ff!important}
      :root[data-theme="tube"] .app-sidebar button[style*="color: rgb(16, 185, 129)"]{color:#FFD329!important}
      :root[data-theme="tube"] .app-sidebar{background:#0b1033!important}
      /* platform edge: a yellow "mind the gap" strip along the top of the phone tab bar */
      :root[data-theme="tube"] .app-nav{border-top:none!important}
      :root[data-theme="tube"] .app-nav::before{content:'MIND THE GAP';position:absolute;left:0;right:0;top:-14px;height:14px;display:flex;align-items:center;justify-content:center;background:#FFD329;border-top:2px solid #111111;box-sizing:border-box;font:700 9px/1 'Cabin',sans-serif;letter-spacing:4px;color:#111111;pointer-events:none}
      /* sidebar as a line diagram: a red line down the icons */
      :root[data-theme="tube"] .app-sidebar .sidebar-nav-btn{padding-left:40px!important;overflow:visible}
      :root[data-theme="tube"] .app-sidebar .sidebar-nav-btn::before{content:'';position:absolute;left:13px;top:-3px;bottom:-3px;width:6px;background:#DC241F;z-index:-1}
      :root[data-theme="tube"] .app-sidebar .sidebar-nav-btn:first-of-type::before{top:50%}

      /* ── Goji (id: muji) ── quiet, natural-goods calm: kraft-paper page and soft
         off-white cards, a warm dark-brown sidebar and header card, and a
         deep maroon accent. The save button is cream with maroon text so it
         stands out on the brown bar. Zen Kaku Gothic New letters (a
         Japanese-style gothic), IBM Plex Sans figures. */
      :root[data-theme="muji"]{
        color-scheme: light;
        --save-bg:#fffdf8;
        --save-ink:#7f0019;
        --hero-label:#f1c9a5;
        --title-grad:linear-gradient(135deg,#3a3128,#3a3128);
        --page-bg:#f3efe6;
        --surface:#fffdf8;
        --surface-rgb:255,253,248;
        --surface-2:#f8f4ec;
        --surface-2-rgb:248,244,236;
        --chip-bg:#efe9dc;
        --border:#e1d9c8;
        --border-2:#ece6d8;
        --ink:#3a3128;
        --muted:#6e6253;
        --quiet:#998c7b;
        --navy:#4a3f35;
        --savebar:#4a3f35;
        --navy-rgb:74,63,53;
        --sidebar-bg-rgb:74,63,53;
        --accent:#7f0019;
        --app-font:'Zen Kaku Gothic New',system-ui,sans-serif;
        --tint-blue:#edf1f6;
        --tint-red:#fbe9e7;
        --tint-green:#e8f4ea;
        --tint-green-2:#d2eadb;
        --tint-purple:#f1ecf8;
        --tint-amber:#fcf2df;
        --tint-amber-2:#f6e1b6;
        --tint-teal:#e4f1ef;
        --text-navy:#3a3128;

        --text-purple-deep:#5e3c9e;
        --text-amber-deep:#8a5807;
        --tint-blue-2:#e2e8f0;
        --tint-brass:#f6e6e3;
        --tint-indigo:#e9eaf7;
        --text-indigo-deep:#3a46a3;
        --surface-red-mid:#eaa29b;
        --text-blue-deep:#7f0019;
      }

      /* ── Luftplane ── airline crispness: a deep ink blue for the sidebar,
         header card, buttons and text, bright yellow for the current tab,
         highlights and the save button (dark-blue text), on a pale-grey page
         with white cards. Flat sidebar, no glow. Arimo letters (a
         Helvetica-style face), IBM Plex Sans figures. */
      :root[data-theme="luftplane"]{
        color-scheme: light;
        --save-bg:#ffad00;
        --save-ink:#05164d;
        --hero-label:#ffad00;
        --title-grad:linear-gradient(135deg,#05164d,#05164d);
        --page-bg:#f2f3f6;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f7f8fa;
        --surface-2-rgb:247,248,250;
        --chip-bg:#eceef3;
        --border:#dcdfe7;
        --border-2:#e8eaf0;
        --ink:#05164d;
        --muted:#4a5378;
        --quiet:#7c84a3;
        --navy:#05164d;
        --savebar:#05164d;

        --text-navy:#05164d;

        --text-amber-deep:#8a5600;
        --tint-blue-2:#dde3f2;
        --tint-brass:#fff4dc;
        --tint-indigo:#e8eaf8;
        --text-indigo-deep:#2f3e9e;
        --surface-red-mid:#eca2a6;
        --text-blue-deep:#1d3f9a;
      }


      html,body,#root{background:var(--page-bg)}
      @media (max-width:349px){.net-spark{display:none}}

      /* Native form elements (input/select/textarea) don't inherit
         anything from the page by default - the browser paints them
         white regardless of theme unless told otherwise. Most of them
         in the app get an explicit background inline already, which
         (being an inline style) always wins over this rule; this is
         just the safety net for ones that only set a border colour
         and never touch background/color, so they'd otherwise stay a
         bright native-white box in dark mode. */
      input, select, textarea{background:var(--surface);color:var(--ink)}
    </style>
  </head>
