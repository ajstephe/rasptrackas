<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"/>
    <meta name="theme-color" content="#0f2744"/>
    <!-- Tells the browser this page genuinely supports both schemes and to
         pick per the OS preference by default — without it, some browsers
         (notably iOS Safari for an installed/home-screen PWA, which this is)
         don't reliably follow prefers-color-scheme at all. The CSS
         color-scheme property below does the same job for engines that
         read it there instead; :root[data-theme] overrides both once the
         user picks Light/Dark explicitly in Options. -->
    <meta name="color-scheme" content="light dark"/>

    <!-- Standalone/installed-app behaviour: apple-mobile-web-app-capable covers
         iOS Safari's "Add to Home Screen"; mobile-web-app-capable is the modern,
         cross-browser equivalent Chrome/Android now honours. Both are needed —
         neither alone covers both platforms — plus a proper manifest.json below,
         which is what Android actually uses to decide whether "Add to Home
         Screen" installs a real chromeless app vs. just a browser bookmark. -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png"/>
    <!-- Classic favicon.ico, generated from the same 192px source. Most
         browsers resolve the PNG above fine, but pinning to the Windows
         taskbar (and some older Edge/compat contexts) still goes looking
         for /favicon.ico specifically and falls back to a blank page icon
         without one. -->
    <link rel="icon" href="/favicon.ico" sizes="any"/>

    <!-- iOS launch screens — without these, opening the installed app shows
         a plain white flash (regardless of theme) for the beat before the
         app's own first paint, which stands out badly against the navy/
         black-translucent status bar treatment above. Each is the app icon
         centred on a flat fill matching --page-bg for that theme exactly
         (see public/splash — generated from pwa-512x512.png), targeted at
         one current iPhone screen size via its exact device-width/height/
         pixel-ratio combination, the only way Safari's launch-screen
         matching works. Portrait only — orientation is locked to portrait
         in manifest.json, so there's no landscape case to cover. Devices
         older/newer than this list just fall back to the plain white
         flash, same as before. -->
    <link rel="apple-touch-startup-image" href="/splash/se-light.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/se-dark.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/mini-light.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/mini-dark.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/standard-light.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/standard-dark.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/pro-light.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/pro-dark.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/plus-light.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>
    <link rel="apple-touch-startup-image" href="/splash/plus-dark.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"/>
    <link rel="apple-touch-startup-image" href="/splash/promax-light.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"/>

    <title>Overtime and Shift Tracker by Adam Stephens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <!-- DM Sans now includes 800 alongside the weights already here —
         fontWeight:800 is used on buttons/labels throughout the app, but that
         cut was never actually being requested, so browsers were silently
         substituting the nearest loaded weight (900) instead. IBM Plex Mono
         stays at 500/600/700 deliberately: Google Fonts doesn't offer a 900
         ("Black") cut of it at all (confirmed directly against the API — a
         900 request is just dropped, not served as anything), so the fix for
         MONO+fontWeight:900 usages is at each of those call sites instead,
         switched to the real 700 they were already silently rendering as.
         See the round-7 audit for how both were confirmed. -->
    <!-- Inter (Professional Light) and Geist + Geist Mono (Corporate) are
         added alongside DM Sans/IBM Plex Mono so every theme beyond the
         default can load its type without a second request each. -->
    <!-- Space Grotesk (Midnight), Ysabeau Office (Flagship), Libre
         Franklin (Heritage) and Nunito + Roboto Mono (Heather) added alongside the rest for the same reason Inter was —
         so all Appearance options load their type up front instead of on
         first pick. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Ysabeau+Office:wght@400;500;600;700;800;900&family=Libre+Franklin:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@500;600;700&family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body,#root{height:100%;width:100%}

      /* ── Theme tokens ──────────────────────────────────────────────────
         The app renders almost entirely via inline style objects, so these
         custom properties are read directly as style values (e.g.
         background:'var(--surface)') rather than through CSS classes.
         Light values live on :root; dark overrides apply either when the
         OS prefers dark and the user hasn't overridden it (data-theme
         unset), or when the user has explicitly chosen dark. This mirrors
         the artifact-design light/dark pattern used for the app's own
         mockups. */
      :root{
        /* App name gradient and the purple TOIL/Mix tag text — set per
           theme so both stay readable on dark backgrounds. */
        --title-grad:linear-gradient(135deg,#1e3a5f,#2563eb);
        --tag-purple:#6d28d9;
        color-scheme: light dark;
        --page-bg:#e2e8f0;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f8fafc;
        --surface-2-rgb:248,250,252;
        --chip-bg:#f1f5f9;
        --border:#e2e8f0;
        --border-2:#f1f5f9;
        --ink:#0f172a;
        --muted:#64748b;
        /* --quiet is deliberately quieter than --muted (tertiary vs.
           secondary label, in Apple's terms) so it's never going to hit
           full 4.5:1 AA on its own — Apple's own tertiaryLabel doesn't
           either, by design. #94a3b8 measured ~2.1:1 on the page
           background though, well below even that tier's usual ~3:1;
           nudged one step darker to land there without erasing the
           distinction from --muted. */
        --quiet:#78849b;
        --navy:#0f2744;
        --navy-rgb:15,39,68;
        --sidebar-bg-rgb:15,39,68;
        --accent:#b8823f;
        --app-font:'DM Sans',system-ui,sans-serif;
        /* Money/hours figures (MONO in App.jsx). Only Flagship overrides
           it; every other theme keeps IBM Plex Mono. */
        --num-font:'IBM Plex Mono',monospace;
        --tint-blue:#eff6ff;
        --tint-red:#fef2f2;
        --tint-green:#f0fdf4;
        --tint-green-2:#dcfce7;
        --tint-purple:#f5f3ff;
        --tint-amber:#fffbeb;
        --tint-amber-2:#fef3c7;
        --tint-teal:#f0fdfa;
        --text-navy:#1e3a5f;
        --text-red-deep:#991b1b;
        --text-green-deep:#166534;
        --text-purple-deep:#4c1d95;
        --text-amber-deep:#92400e;
        --tint-blue-2:#dbeafe;
        --tint-brass:#faf3e8;
        --tint-indigo:#e0e7ff;
        --text-indigo-deep:#4338ca;
        --surface-red-mid:#fca5a5;
        --text-blue-deep:#1e40af;
      }
      @media (prefers-color-scheme: dark){
        /* Every custom theme below is a fixed look, not a dark-mode-aware
           variant of the default — excluded here the same way an explicit
           "light" choice already is, so a dark OS never quietly overrides
           any of them one token at a time. Midnight is a dark-first design
           in its own right, so this matters just as much for it as it does
           for the light ones. */
        :root:not([data-theme="light"]):not([data-theme="corporate"]):not([data-theme="professional"]):not([data-theme="midnight"]):not([data-theme="flagship"]):not([data-theme="heritage"]):not([data-theme="heather"]){
          --title-grad:linear-gradient(135deg,#eef2f7,#93c5fd);
          --tag-purple:#cbb8f7;
          --page-bg:#0b1220;
          --surface:#111c2e;
          --surface-rgb:17,28,46;
          --surface-2:#0e1726;
          --surface-2-rgb:14,23,38;
          --chip-bg:#182740;
          --border:#20304a;
          --border-2:#1c2c44;
          --ink:#eef2f7;
          --muted:#93a4bb;
          --quiet:#64789a;
          --navy:#16314f;
          --savebar:#1e3a5f;
          --navy-rgb:22,49,79;
          --sidebar-bg-rgb:22,49,79;
          --accent:#b8823f;
          --tint-blue:#132840;
          --tint-red:#2c1416;
          --tint-green:#0f2a1e;
          --tint-green-2:#123322;
          --tint-purple:#221a3d;
          --tint-amber:#2b2110;
          --tint-amber-2:#332714;
          --tint-teal:#0e2b2a;
          --text-navy:#9fc0e6;
          --text-red-deep:#f3a9a9;
          --text-green-deep:#86e0ae;
          --text-purple-deep:#cbb8f7;
          --text-amber-deep:#f3c58c;
          --tint-blue-2:#16314f;
          --tint-brass:#2e2415;
          --tint-indigo:#1c1f3d;
          --text-indigo-deep:#a9b3f5;
          --surface-red-mid:#5c2020;
          --text-blue-deep:#a8c5f0;
        }
      }
      :root[data-theme="light"]{
        color-scheme: light;
      }
      :root[data-theme="dark"]{
        --title-grad:linear-gradient(135deg,#eef2f7,#93c5fd);
        --tag-purple:#cbb8f7;
        color-scheme: dark;
        --page-bg:#0b1220;
        --surface:#111c2e;
        --surface-rgb:17,28,46;
        --surface-2:#0e1726;
        --surface-2-rgb:14,23,38;
        --chip-bg:#182740;
        --border:#20304a;
        --border-2:#1c2c44;
        --ink:#eef2f7;
        --muted:#93a4bb;
        --quiet:#64789a;
        --navy:#16314f;
          --savebar:#1e3a5f;
        --sidebar-bg-rgb:22,49,79;
        --accent:#b8823f;
        --tint-blue:#132840;
        --tint-red:#2c1416;
        --tint-green:#0f2a1e;
        --tint-green-2:#123322;
        --tint-purple:#221a3d;
        --tint-amber:#2b2110;
        --tint-amber-2:#332714;
        --tint-teal:#0e2b2a;
        --text-navy:#9fc0e6;
        --text-red-deep:#f3a9a9;
        --text-green-deep:#86e0ae;
        --text-purple-deep:#cbb8f7;
        --text-amber-deep:#f3c58c;
        --tint-blue-2:#16314f;
        --tint-brass:#2e2415;
        --tint-indigo:#1c1f3d;
        --text-indigo-deep:#a9b3f5;
        --surface-red-mid:#5c2020;
        --text-blue-deep:#a8c5f0;
      }

      /* ── Corporate ── sleek and modern: a crisp white sidebar with a
         hairline edge (--sidebar-bg-rgb is white, decoupled from --navy),
         graphite statement cards and save bar, cool grey neutrals and one
         vivid cobalt accent. Geist for letters, Geist Mono for figures.
         Replaced Apple-Inspired; a saved "apple" choice is migrated to
         "corporate" when the app loads (see themeMode in App.jsx). */
      :root[data-theme="corporate"]{
        color-scheme: light;
        --page-bg:#f4f5f7;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f9fafb;
        --surface-2-rgb:249,250,251;
        --chip-bg:#eef0f3;
        --border:#dcdfe5;
        --border-2:#e9ebef;
        --ink:#111318;
        --muted:#5b616e;
        --quiet:#858b97;
        --navy:#16181d;
        --savebar:#16181d;
        --navy-rgb:22,24,29;
        --sidebar-bg-rgb:255,255,255;
        --accent:#0f62fe;
        --app-font:'Geist',system-ui,sans-serif;
        --num-font:'Geist Mono',ui-monospace,monospace;
        --tint-blue:#edf3ff;
        --tint-red:#fdeeee;
        --tint-green:#e9f8ef;
        --tint-green-2:#d5f1df;
        --tint-purple:#f2ecfb;
        --tint-amber:#fff4e0;
        --tint-amber-2:#ffe5b8;
        --tint-teal:#e4f6f4;
        --text-navy:#16181d;
        --text-red-deep:#c8102e;
        --text-green-deep:#17703f;
        --text-purple-deep:#6b3fb0;
        --text-amber-deep:#9a5500;
        --tint-blue-2:#dbe7ff;
        --tint-brass:#edf3ff;
        --tint-indigo:#eceefd;
        --text-indigo-deep:#4449c2;
        --surface-red-mid:#f59a9a;
        --text-blue-deep:#0043ce;
      }

      /* ── Professional Light ── quieter and denser: Inter, a flat slate
         sidebar with no glow effect (sidebarGlow is unset for this theme in
         App.jsx), tighter corners applied at the component level, and one
         restrained teal accent standing in for the default's brass. --navy
         drives both the masthead cards and the sidebar here (no need to
         decouple them the way Corporate's does), so --sidebar-bg-rgb just
         mirrors --navy-rgb. */
      :root[data-theme="professional"]{
        color-scheme: light;
        --page-bg:#f8fafc;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f1f5f9;
        --surface-2-rgb:241,245,249;
        --chip-bg:#eef1f6;
        --border:#e2e8f0;
        --border-2:#e8ecf2;
        --ink:#0f172a;
        --muted:#475569;
        --quiet:#64748b;
        --navy:#111827;
        --navy-rgb:17,24,39;
        --sidebar-bg-rgb:17,24,39;
        --accent:#0f766e;
        --app-font:'Inter',system-ui,sans-serif;
        --tint-blue:#eff6ff;
        --tint-red:#fef2f2;
        --tint-green:#f0fdf4;
        --tint-green-2:#dcfce7;
        --tint-purple:#f5f3ff;
        --tint-amber:#fffbeb;
        --tint-amber-2:#fef3c7;
        --tint-teal:#f0fdfa;
        --text-navy:#0f766e;
        --text-red-deep:#991b1b;
        --text-green-deep:#166534;
        --text-purple-deep:#4c1d95;
        --text-amber-deep:#92400e;
        --tint-blue-2:#dbeafe;
        --tint-brass:#f0fdfa;
        --tint-indigo:#e0e7ff;
        --text-indigo-deep:#4338ca;
        --surface-red-mid:#fca5a5;
        --text-blue-deep:#1e40af;
      }

      /* ── Midnight ── a dark-first look, not a moodier version of the
         default Dark theme: the whole page drops to near-black (not just
         the sidebar), one electric-cyan accent stands in for brass, and
         Space Grotesk's geometric character replaces DM Sans. --navy sits
         one step above --page-bg rather than reusing it outright, so the
         Home/Awaits Submission statement cards still read as distinct
         surfaces against a page this dark. */
      :root[data-theme="midnight"]{
        --title-grad:linear-gradient(135deg,#e7ecf5,#22d3ee);
        --tag-purple:#cbb8f7;
        color-scheme: dark;
        --page-bg:#05080f;
        --surface:#101722;
        --surface-rgb:16,23,34;
        --surface-2:#161f2d;
        --surface-2-rgb:22,31,45;
        --chip-bg:#1c2636;
        --border:#263148;
        --border-2:#1c2636;
        --ink:#e7ecf5;
        --muted:#8ea0bb;
        --quiet:#5c6d88;
        --navy:#0c121c;
        --savebar:#1b2738;
        --navy-rgb:12,18,28;
        --sidebar-bg-rgb:5,8,15;
        --accent:#22d3ee;
        --app-font:'Space Grotesk',system-ui,sans-serif;
        --tint-blue:#0f1f2e;
        --tint-red:#2a1315;
        --tint-green:#0f2a20;
        --tint-green-2:#123a2c;
        --tint-purple:#1e1830;
        --tint-amber:#2a2013;
        --tint-amber-2:#332813;
        --tint-teal:#0d2626;
        --text-navy:#7dd3f2;
        --text-red-deep:#f3a9a9;
        --text-green-deep:#86e0ae;
        --text-purple-deep:#c4b5f7;
        --text-amber-deep:#f2c579;
        --tint-blue-2:#142c3f;
        --tint-brass:#123a45;
        --tint-indigo:#1c2040;
        --text-indigo-deep:#b0b8f7;
        --surface-red-mid:#5c2020;
        --text-blue-deep:#8fd0f5;
      }

      /* ── Flagship ── inspired by British Airways' design language (not
         its name, logo or ribbon): a deep navy sidebar and statement cards,
         white cards on a cool grey page, an airline blue for every accent,
         and red kept for one job only — marking the active tab (the
         navActiveIcon palette entry in App.jsx). Letters and figures share
         one typeface the way BA's own Mylius Modern does; Ysabeau Office is
         the closest freely-licensed match, so --num-font follows --app-font
         here instead of staying IBM Plex Mono. Tabular lining figures keep
         amounts lining up in columns the way the monospace did. */
      :root[data-theme="flagship"]{
        color-scheme: light;
        --page-bg:#eef1f5;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f6f8fb;
        --surface-2-rgb:246,248,251;
        --chip-bg:#edf1f6;
        --border:#d9dfe8;
        --border-2:#e7ebf1;
        --ink:#0b1f45;
        --muted:#4a5a78;
        --quiet:#6d7c96;
        --navy:#0a2356;
        --navy-rgb:10,35,86;
        --sidebar-bg-rgb:10,35,86;
        --accent:#2b64c2;
        --app-font:'Ysabeau Office',system-ui,sans-serif;
        --num-font:'Ysabeau Office',system-ui,sans-serif;
        --tint-blue:#e8f0fb;
        --tint-red:#fdecec;
        --tint-green:#e9f7ef;
        --tint-green-2:#d5f0df;
        --tint-purple:#f1edfb;
        --tint-amber:#fff4e2;
        --tint-amber-2:#ffe6bf;
        --tint-teal:#e6f5f3;
        --text-navy:#0a2356;
        --text-red-deep:#b3151d;
        --text-green-deep:#16733f;
        --text-purple-deep:#5b3fb0;
        --text-amber-deep:#a85f00;
        --tint-blue-2:#d6e4f8;
        --tint-brass:#e8f0fb;
        --tint-indigo:#e8ebfb;
        --text-indigo-deep:#3848b8;
        --surface-red-mid:#f3a0a4;
        --text-blue-deep:#1f56b3;
      }
      /* font-size-adjust: Ysabeau Office's x-height is 0.43 of its size
         against DM Sans' 0.50, so at the same px sizes it read noticeably
         smaller than every other theme. 0.48 rather than the full 0.50
         keeps its width in line with Space Grotesk (already known
         to fit the sidebar, nav and tables); at 0.50 it runs ~11% wider
         than DM Sans. Browsers without support just keep today's size. */
      :root[data-theme="flagship"] body{font-variant-numeric:lining-nums tabular-nums;font-size-adjust:0.48}

         highlights via brassLight in App.jsx. Libre Franklin for letters;
         numbers stay IBM Plex Mono, since wider monos wrapped the Home
         figures on phones. */

        color-scheme: light;
        --page-bg:#ebe8dd;
        --surface:#fffdf6;
        --surface-rgb:255,253,246;
        --surface-2:#f5f2e8;
        --surface-2-rgb:245,242,232;

        --border:#dcd7c6;
        --border-2:#e9e5d7;

        --muted:#56655b;
        --quiet:#839086;
        --navy:#123b2c;
        --navy-rgb:18,59,44;
        --sidebar-bg-rgb:18,59,44;
        --accent:#1f6b4a;
        --app-font:'Libre Franklin',system-ui,sans-serif;
        --tint-blue:#e9f1ec;
        --tint-red:#f7e6e2;
        --tint-green:#e6f2ea;
        --tint-green-2:#d2e8d9;
        --tint-purple:#efeaf4;
        --tint-amber:#fbf1dc;
        --tint-amber-2:#f6e2b5;
        --tint-teal:#e3f1ee;
        --text-navy:#123b2c;
        --text-red-deep:#a3261d;
        --text-green-deep:#17613f;
        --text-purple-deep:#5b3f96;
        --text-amber-deep:#8a5a08;
        --tint-blue-2:#d4e6db;
        --tint-brass:#f3ecd6;
        --tint-indigo:#e8eaf6;
        --text-indigo-deep:#3b4aa0;
        --surface-red-mid:#eaa39c;
        --text-blue-deep:#1f5f8b;
      }

      /* ── Heather ── deep plum chrome, soft lilac page, raspberry accent.
         Raspberry rather than purple so it never gets confused with the
         TOIL purple used across the app. Nunito letters, Roboto Mono
         figures. */
      :root[data-theme="heather"]{
        color-scheme: light;
        --page-bg:#efeaf1;
        --surface:#ffffff;
        --surface-rgb:255,255,255;
        --surface-2:#f8f4f9;
        --surface-2-rgb:248,244,249;
        --chip-bg:#f0e9f2;
        --border:#e2d8e6;
        --border-2:#eee7f1;
        --ink:#2a1730;
        --muted:#6e5a75;
        --quiet:#94839a;
        --navy:#2e1a36;
        --navy-rgb:46,26,54;
        --sidebar-bg-rgb:46,26,54;
        --accent:#b8336a;
        --app-font:'Nunito',system-ui,sans-serif;
        --num-font:'Roboto Mono',monospace;
        --tint-blue:#edf1fb;
        --tint-red:#fbe8ec;
        --tint-green:#e8f6ee;
        --tint-green-2:#d3eedd;
        --tint-purple:#f3ecfa;
        --tint-amber:#fdf2e1;
        --tint-amber-2:#fbe3bd;
        --tint-teal:#e5f4f2;
        --text-navy:#2e1a36;
        --text-red-deep:#b0213b;
        --text-green-deep:#17703f;
        --text-purple-deep:#6a2f9a;
        --text-amber-deep:#9a5a07;
        --tint-blue-2:#e2e7f7;
        --tint-brass:#fbe8f0;
        --tint-indigo:#ebeafb;
        --text-indigo-deep:#4a3fb0;
        --surface-red-mid:#f0a3b5;
        --text-blue-deep:#2f59b0;
      }

      html,body,#root{background:var(--page-bg)}
      @media (max-width:349px){.net-spark{display:none}}

      /* Native form elements (input/select/textarea) don't inherit
         anything from the page by default - the browser paints them
         white regardless of theme unless told otherwise. Most of them
         in the app get an explicit background inline already, which
         (being an inline style) always wins over this rule; this is
         just the safety net for ones that only set a border colour
         and never touch background/color, so they'd otherwise stay a
         bright native-white box in dark mode. */
      input, select, textarea{background:var(--surface);color:var(--ink)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
